[project]
name = "Livt.Base"
version = "1.2.1"
description = "Foundational bit, array, string, conversion, formatting, and timing helpers for Livt hardware designs."
authors = ["Denis Vasilík"]
repository = "https://github.com/eccelerators/livt-base"
homepage = "https://github.com/eccelerators/livt-base"
keywords = ["fpga", "base", "bits", "arrays", "strings", "timing"]
license = "MIT"
path = "src"
outdir = "out"

[publish]
files = ["README.md", "CHANGELOG.md", "LICENSE"]

[project.organization]
name = "Eccelerators GmbH"
website = "https://eccelerators.com"

[tests]
path = "tests"
components = [
    "IterationTest",
    "ArrayIterationTest",
    "BitsTest",
    "AsciiTest",
    "ConvertTest",
    "FormatTest",
    "ArrayTest",
    "DiagnosticsTest",
    "ArrayUnsizedParamTest",
    "StringTest",
    "StringHelperTest",
    "PeriodicTickProviderTest",
    "PeriodicTickProvider50MHzTest"
]

[build.debug]
warnings = ["all"]

[build.release]
warnings = ["all"]
